services:
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    container_name: traefik-docker-socket-proxy
    restart: always
    user: "65534:${DOCKER_GID:-124}"
    command:
      - -listenip=0.0.0.0
      - -allowfrom=traefik
      - -allowHEAD=/_ping
      - '-allowGET=/v1\.[0-9]+/version'
      - '-allowGET=/v1\.[0-9]+/containers/json'
      - '-allowGET=/v1\.[0-9]+/containers/[0-9a-f]+/json'
      - '-allowGET=/v1\.[0-9]+/events'
      - -allowhealthcheck
      - -watchdoginterval=60
      - -stoponwatchdog
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3

  traefik:
    image: traefik:v3.6.2
    container_name: traefik
    restart: always
    init: true
    user: "65532:1000"
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=65532,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "80:80"
      - "443:443/tcp"
    env_file:
      - ./.env
    environment:
      TZ: "${TIMEZONE:-Asia/Tokyo}"
    labels:
      traefik.enable: true
      traefik.http.routers.dashboard.rule: "Host(`${DASHBOARD_HOSTNAME}`)" # Hostname for this dashboard
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.tls.certresolver: cloudflare
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik:/letsencrypt
    extra_hosts:  
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - docker-api
  traefik-ssl-certificate-exporter:
    container_name: traefik-cert
    image: rafi0101/traefik-ssl-certificate-exporter:latest
    user: "65532:1000"
    init: true
    entrypoint: ["/bin/bash", "/app/export-certificates.sh"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=65532,gid=1000,mode=0700
    environment:
      EXPORT_INTERVAL_SECONDS: "60"
    volumes:
      - ./export-certificates.sh:/app/export-certificates.sh:ro
      - traefik:/app/traefik/:ro
      - traefik-certs:/app/certs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

networks:
  default:
    name: traefik-nw
    external: true
  docker-api:
    internal: true

volumes:
  traefik:
    name: traefik
  traefik-certs:
    name: traefik-certs
