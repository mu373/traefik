services:
  traefik:
    image: traefik:v3.6.2
    container_name: traefik
    restart: always
    init: true
    user: "65532:1000"
    group_add:
      - "${DOCKER_GID:-124}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,uid=65532,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "80:80"
      - "443:443/tcp"
    env_file:
      - ./.env
    environment:
      TZ: "${TIMEZONE:-Asia/Tokyo}"
    labels:
      traefik.enable: true
      traefik.http.routers.dashboard.rule: "Host(`${DASHBOARD_HOSTNAME}`)" # Hostname for this dashboard
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.tls.certresolver: cloudflare
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik:/letsencrypt
    extra_hosts:  
      - "host.docker.internal:host-gateway"
  traefik-ssl-certificate-exporter:
    container_name: traefik-cert
    image: rafi0101/traefik-ssl-certificate-exporter:latest
    user: "65532:1000"
    init: true
    entrypoint: ["/bin/bash", "/app/export-certificates.sh"]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=65532,gid=1000,mode=0700
    environment:
      EXPORT_INTERVAL_SECONDS: "60"
    volumes:
      - ./export-certificates.sh:/app/export-certificates.sh:ro
      - traefik:/app/traefik/:ro
      - traefik-certs:/app/certs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

networks:
  default:
    name: traefik-nw
    external: true

volumes:
  traefik:
    name: traefik
  traefik-certs:
    name: traefik-certs
