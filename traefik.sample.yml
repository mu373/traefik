entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443

api:
  insecure: false
  dashboard: true

providers:
  docker:
    endpoint: tcp://docker-socket-proxy:2375
    exposedByDefault: false

# log:
#   level: DEBUG

serversTransport:
  insecureSkipVerify: true #Skip verification for upstream https certificate

# Settings for DNS Challenge
certificatesResolvers:
  cloudflare:
    acme:
      dnsChallenge:
        provider: cloudflare
        delayBeforeCheck: 60
        resolvers: 1.1.1.1:53, 1.0.0.1:53
      email: mail@example.com
      storage: /letsencrypt/acme.json
      keyType: EC384
